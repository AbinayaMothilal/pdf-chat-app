<div class="app-container">

  <!-- Header -->
  <header class="app-header">
    <div class="app-title">
      <div class="app-icon">📄</div>
      <div>
        <h1>PDF Chat</h1>
        <span>Ask questions about your document</span>
      </div>
    </div>

  </header>

  <!-- Main Workspace -->
  <main class="workspace">

    <!-- LEFT : PDF -->
    <section class="pdf-panel">
      <app-upload (pdfUploadedEvent)="pdfUploaded($event)" (pdfRemovedEvent)="pdfRemoved($event)"></app-upload>
    </section>

    <!-- RIGHT : CHAT -->
    <section class="chat-panel">
      <app-chat [pdfUpload]="pdfUpload" [filePath]="filePath"></app-chat>
    </section>

  </main>

</div>
